spring.application.name=ianesbank_master
server.port=8080
spring.datasource.url=jdbc:mariadb://localhost:3306/ianeSBank_Master
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.dialect=br.com.senai.ianesbank_master.config.MariaDb104Dialect
spring.jackson.default-property-inclusion=non_null
ianesbank.jwt.secret=${JWT_SECRET:SENAI_BANK_APENAS_DEMO_LOCAL_TROCAR_CHAVE_AN_TES_DO_DEPLOY_2026}
ianesbank.jwt.expiration-minutes=480
