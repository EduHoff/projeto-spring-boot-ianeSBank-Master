services:
  backend:
    build: ./backend
    container_name: ianesbank-api
    ports:
      - "8080:8080"
    environment:
      - DB_USER=root
      - DB_PASSWORD=senha_db
      - SPRING_DATASOURCE_URL=jdbc:mariadb://host.docker.internal:3306/ianeSBank_Master?useSSL=false&serverTimezone=UTC
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build: ./frontend
    container_name: ianesbank-web
    ports:
      - "4200:80"
    depends_on:
      - backend
